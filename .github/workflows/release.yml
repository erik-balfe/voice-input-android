name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Build release APK
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest --no-daemon

      - name: Package release APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "grok-voice-input-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: grok-voice-input-*.apk
          generate_release_notes: true
          body: |
            Install `grok-voice-input-*.apk` (allow install from unknown sources if needed).

            ### Setup
            1. Open **Grok Voice Input** → **Sign in with xAI** (OAuth) or paste an **API key**.
            2. Grant microphone.
            3. System **Settings → Languages & input → On-screen keyboard → Manage keyboards → Grok Voice Input → ON**.
            4. Switch to it from the keyboard picker.

            ### Highlights
            - Skip long non-speech pauses before upload; History keeps the full take
            - Progressive AAC while you speak (fast ✓ → text)
            - Multi-take voice keyboard (stay ready after insert by default)
            - **History** of takes; lock/home mid-take saves meaningful audio and can auto-transcribe
            - Pause / resume, newline, switch to typing keyboard

            Note: CI APK is release-built; signing uses the debug keystore unless repository signing secrets are configured.